<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Login Seguro</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header class="topo">
        <div class="logo">
            Login Seguro
        </div>

        <div class="usuario">
            <span>Bem-vindo!</span>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-sair">Sair</button>
            </form>
        </div>
    </header>

    <main class="container">

        <section class="cadastro-produto">

            <h1>Cadastrar produto</h1>

            <form th:action="@{/produtos}" method="post">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Nome do produto"
                        required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <input
                        type="text"
                        id="descricao"
                        name="descricao"
                        placeholder="Descrição do produto">
                </div>

                <div class="campo">
                    <label for="valor">Valor</label>
                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        step="0.01"
                        min="0.01"
                        placeholder="0,00"
                        required>
                </div>

                <button type="submit" class="btn-cadastrar">
                    Cadastrar
                </button>

            </form>

        </section>


        <section class="produtos">

            <h1>Produtos</h1>

            <div class="lista-produtos">

                <div
                    class="produto-card"
                    th:each="produto : ${produtos}">

                    <h2 th:text="${produto.nome}">
                        Nome do produto
                    </h2>

                    <p th:text="${produto.descricao}">
                        Descrição do produto
                    </p>

                    <strong>
                        R$
                        <span
                            class="preco-produto"
                            th:text="${#numbers.formatDecimal(produto.valor, 1, 2)}">
                            0,00
                        </span>
                    </strong>


                    <div class="compra-produto">

                        <label>
                            <input
                                type="checkbox"
                                class="produto-checkbox"
                                th:data-valor="${produto.valor}"
                                th:value="${produto.id}">

                            Comprar
                        </label>

                    </div>


                    <div class="acoes-produto">

                        <button
                            type="button"
                            class="btn btn-primary btn-editar"
                            data-bs-toggle="modal"
                            th:attr="data-bs-target='#modalEditar' + ${produto.id}">
                            Editar
                        </button>


                        <form
                            th:action="@{/produtos/excluir}"
                            method="post">

                            <input
                                type="hidden"
                                name="id"
                                th:value="${produto.id}">

                            <button
                                type="submit"
                                class="btn btn-danger">
                                Excluir
                            </button>

                        </form>

                    </div>


                    <div
                        class="modal fade"
                        th:id="'modalEditar' + ${produto.id}"
                        tabindex="-1"
                        aria-hidden="true">

                        <div class="modal-dialog">

                            <div class="modal-content">

                                <div class="modal-header">

                                    <h5 class="modal-title">
                                        Editar produto
                                    </h5>

                                    <button
                                        type="button"
                                        class="btn-close"
                                        data-bs-dismiss="modal"
                                        aria-label="Fechar">
                                    </button>

                                </div>


                                <form
                                    th:action="@{/produtos/editar}"
                                    method="post">

                                    <div class="modal-body">

                                        <input
                                            type="hidden"
                                            name="id"
                                            th:value="${produto.id}">


                                        <div class="mb-3">

                                            <label class="form-label">
                                                Nome
                                            </label>

                                            <input
                                                type="text"
                                                class="form-control"
                                                name="nome"
                                                th:value="${produto.nome}"
                                                required>

                                        </div>


                                        <div class="mb-3">

                                            <label class="form-label">
                                                Descrição
                                            </label>

                                            <input
                                                type="text"
                                                class="form-control"
                                                name="descricao"
                                                th:value="${produto.descricao}">

                                        </div>


                                        <div class="mb-3">

                                            <label class="form-label">
                                                Valor
                                            </label>

                                            <input
                                                type="number"
                                                class="form-control"
                                                name="valor"
                                                th:value="${produto.valor}"
                                                step="0.01"
                                                min="0.01"
                                                required>

                                        </div>

                                    </div>


                                    <div class="modal-footer">

                                        <button
                                            type="button"
                                            class="btn btn-secondary"
                                            data-bs-dismiss="modal">
                                            Cancelar
                                        </button>

                                        <button
                                            type="submit"
                                            class="btn btn-primary">
                                            Salvar alterações
                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>


                <p
                    class="sem-produtos"
                    th:if="${#lists.isEmpty(produtos)}">
                    Nenhum produto cadastrado.
                </p>

            </div>

        </section>


        <form
            class="total-compra"
            th:action="@{/compras}"
            method="post">

            <h2>
                Total da compra:
                R$
                <span id="totalCompra">
                    0,00
                </span>
            </h2>

            <input
                type="hidden"
                name="valorTotal"
                id="valorTotal">

            <div id="produtosSelecionados"></div>

            <button
                type="submit"
                id="btnComprar">
                Comprar
            </button>

        </form>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script th:src="@{/js/home.js}"></script>

</body>

</html>
