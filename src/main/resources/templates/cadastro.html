
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro - Login Seguro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow p-4" style="width: 100%; max-width: 450px;">
        <h2 class="text-center mb-4">Criar conta</h2>

        <div th:if="${erro}" class="alert alert-danger"
             th:text="${erro}"></div>

        <form th:action="@{/cadastro}" method="post">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" name="nome"
                       class="form-control" required maxlength="100">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" id="email" name="email"
                       class="form-control" required maxlength="150">
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" name="senha"
                       class="form-control" required minlength="8">
            </div>

            <div class="mb-3">
                <label for="confirmarSenha" class="form-label">
                    Confirmar senha
                </label>
                <input type="password" id="confirmarSenha"
                       name="confirmarSenha" class="form-control"
                       required minlength="8">
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Cadastrar
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            Já possui uma conta?
            <a th:href="@{/login}">Entrar</a>
        </p>
    </div>
</div>

</body>
</html>
